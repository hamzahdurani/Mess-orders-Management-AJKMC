<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mess Orders</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1c1c1a;--mut:#6b6b66;--acc:#c2410c;--ok:#15803d;--bd:#e4e2da}
@media(prefers-color-scheme:dark){:root{--bg:#171715;--card:#22221f;--ink:#f2f1ec;--mut:#a3a29a;--acc:#fb923c;--ok:#4ade80;--bd:#34332e}}
*{box-sizing:border-box}
body{margin:0;font:17px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
nav{display:flex;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);z-index:2}
nav button{flex:1;padding:14px 4px;font:600 16px system-ui;background:none;border:0;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:560px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font-size:20px}
input[type=text]{width:100%;padding:13px;font-size:17px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.q{display:flex;align-items:center;gap:14px}
.q button{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--ink);font-size:22px}
.q span{min-width:20px;text-align:center;font-weight:700}
.big{width:100%;padding:16px;font:700 18px system-ui;border:0;border-radius:12px;background:var(--acc);color:#fff;margin-top:8px}
.ghost{padding:10px 14px;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;font-size:15px;margin:4px 6px 4px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.card.first{border:2px solid var(--acc)}
.tok{font-weight:800;font-size:22px;color:var(--acc)}
.mut{color:var(--mut);font-size:15px}
.done{background:var(--ok);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:700 16px system-ui;float:right}
.tot{background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:12px;margin-bottom:14px}
.center{text-align:center;padding-top:30px}
.center .tok{font-size:84px;display:block;margin:10px 0}
.err{color:#dc2626;margin:6px 0;min-height:20px}
details.card summary{cursor:pointer;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
.ord{padding:8px 0;border-top:1px solid var(--bd)}
.ord:first-of-type{border-top:0}
</style>
</head>
<body>
<nav>
  <button id="tOrder" class="on">Order</button>
  <button id="tKitchen">Kitchen <span id="cnt"></span></button>
  <button id="tHistory">History</button>
</nav>
<main id="app"></main>

<script>
const KEY = 'messOrders_v1';
const DEFAULT_MENU = ['Paratha', 'Omelette', 'Fried Egg', 'Chana', 'Toast', 'Tea'];

function dayKey(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dayLabel(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
function timeLabel(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!s || !s.orders) s = { menu: DEFAULT_MENU.slice(), orders: [] };
  // migrate orders saved by the older version
  s.orders.forEach(o => {
    if (!o.t) o.t = Date.now();
    if (!o.day) o.day = dayKey(o.t);
    if (!o.id) o.id = o.t + '-' + o.token;
  });
  delete s.next;
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let S = load();
let mode = 'order';
let cart = {};
let form = { name: '', cls: '' };
let last = null;
let err = '';

const app = document.getElementById('app');

function todays() { const k = dayKey(Date.now()); return S.orders.filter(o => o.day === k); }
function pending() { return todays().filter(o => !o.done).sort((a, b) => a.token - b.token); }
function nextToken() { return todays().reduce((m, o) => Math.max(m, o.token), 0) + 1; }
function itemsText(o) { return Object.entries(o.items).map(([k, v]) => v + ' × ' + k).join(', '); }
function totalsOf(list) {
  const t = {};
  list.forEach(o => Object.entries(o.items).forEach(([k, v]) => t[k] = (t[k] || 0) + v));
  return t;
}
function totalsText(t) { return Object.entries(t).map(([k, v]) => v + ' × ' + esc(k)).join(' &nbsp;•&nbsp; '); }

function setMode(m) {
  mode = m;
  document.getElementById('tOrder').className = m === 'order' ? 'on' : '';
  document.getElementById('tKitchen').className = m === 'kitchen' ? 'on' : '';
  document.getElementById('tHistory').className = m === 'history' ? 'on' : '';
  render();
}
document.getElementById('tOrder').onclick = () => setMode('order');
document.getElementById('tKitchen').onclick = () => setMode('kitchen');
document.getElementById('tHistory').onclick = () => setMode('history');

function updateCount() { document.getElementById('cnt').textContent = pending().length ? '(' + pending().length + ')' : ''; }
function render() {
  updateCount();
  if (mode === 'order') renderOrder();
  else if (mode === 'kitchen') renderKitchen();
  else renderHistory();
}

/* ---------- ORDER SCREEN ---------- */
function renderOrder() {
  if (last) {
    app.innerHTML = '<div class="center"><div class="mut">Your order is placed, ' + esc(last.name) + '</div>' +
      '<span class="tok">#' + last.token + '</span>' +
      '<div>' + esc(itemsText(last)) + '</div>' +
      '<div class="mut" style="margin-top:14px">Orders ahead of you: ' + last.ahead + '</div>' +
      '<button class="big" id="nextStu">Next student</button></div>';
    document.getElementById('nextStu').onclick = () => { last = null; render(); };
    return;
  }
  let h = '<h2>Place your order</h2>' +
    '<input type="text" id="nm" placeholder="Your name" value="' + esc(form.name) + '">' +
    '<input type="text" id="cl" placeholder="Your class (e.g. 2nd year B)" value="' + esc(form.cls) + '">';
  S.menu.forEach((m, i) => {
    h += '<div class="row"><b>' + esc(m) + '</b><div class="q">' +
      '<button data-m="' + i + '" data-d="-1">−</button><span>' + (cart[m] || 0) + '</span>' +
      '<button data-m="' + i + '" data-d="1">+</button></div></div>';
  });
  h += '<div class="err">' + esc(err) + '</div><button class="big" id="place">Place order</button>';
  app.innerHTML = h;
  document.getElementById('nm').oninput = e => form.name = e.target.value;
  document.getElementById('cl').oninput = e => form.cls = e.target.value;
  app.querySelectorAll('.q button').forEach(b => b.onclick = () => {
    const m = S.menu[+b.dataset.m];
    const v = Math.max(0, (cart[m] || 0) + +b.dataset.d);
    if (v) cart[m] = v; else delete cart[m];
    err = '';
    renderOrder();
  });
  document.getElementById('place').onclick = placeOrder;
}

function placeOrder() {
  S = load();
  if (!form.name.trim() || !form.cls.trim()) { err = 'Please enter your name and class.'; return renderOrder(); }
  if (!Object.keys(cart).length) { err = 'Please choose at least one item.'; return renderOrder(); }
  const now = Date.now();
  const o = { id: now + '-' + Math.random().toString(36).slice(2, 6), day: dayKey(now), token: nextToken(),
              name: form.name.trim(), cls: form.cls.trim(), items: cart, done: false, t: now };
  const ahead = pending().length;
  S.orders.push(o);
  save();
  last = Object.assign({ ahead }, o);
  cart = {}; form = { name: '', cls: '' }; err = '';
  render();
}

/* ---------- KITCHEN SCREEN ---------- */
function renderKitchen() {
  const p = pending();
  const done = todays().filter(o => o.done).sort((a, b) => b.token - a.token);

  let h = '<h2>Kitchen queue <span class="mut">· ' + dayLabel(dayKey(Date.now())) + '</span></h2>';
  if (p.length) h += '<div class="tot"><b>To make in total:</b><br>' + totalsText(totalsOf(p)) + '</div>';
  if (!p.length) h += '<p class="mut">No pending orders.</p>';
  p.forEach((o, i) => {
    h += '<div class="card' + (i === 0 ? ' first' : '') + '">' +
      '<button class="done" data-id="' + o.id + '">Done</button>' +
      '<span class="tok">#' + o.token + '</span> <b>' + esc(o.name) + '</b>' +
      '<div class="mut">' + esc(o.cls) + ' · ' + timeLabel(o.t) + '</div>' +
      '<div style="margin-top:6px;clear:both">' + esc(itemsText(o)) + '</div></div>';
  });
  h += '<div style="margin-top:18px"><button class="ghost" id="editMenu">Edit menu</button></div>';
  if (done.length) {
    h += '<h2 style="margin-top:20px">Completed today (' + done.length + ')</h2>';
    done.slice(0, 15).forEach(o => {
      h += '<div class="row"><span><b>#' + o.token + '</b> ' + esc(o.name) + ' <span class="mut">' + esc(o.cls) + '</span></span>' +
           '<button class="ghost" data-undo="' + o.id + '">Undo</button></div>';
    });
  }
  app.innerHTML = h;

  app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => mark(b.dataset.id, true));
  app.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => mark(b.dataset.undo, false));
  document.getElementById('editMenu').onclick = () => {
    const v = prompt('Menu items, separated by commas:', S.menu.join(', '));
    if (v === null) return;
    const list = v.split(',').map(s => s.trim()).filter(Boolean);
    if (list.length) { S.menu = list; save(); render(); }
  };
}

function mark(id, val) {
  S = load();
  const o = S.orders.find(x => x.id === id);
  if (o) { o.done = val; save(); }
  render();
}

/* ---------- HISTORY SCREEN ---------- */
function renderHistory() {
  const days = {};
  S.orders.forEach(o => (days[o.day] = days[o.day] || []).push(o));
  const keys = Object.keys(days).sort().reverse();

  let h = '<h2>Daily records</h2>';
  if (!keys.length) {
    app.innerHTML = h + '<p class="mut">No orders recorded yet.</p>';
    return;
  }
  h += '<div style="margin-bottom:12px"><button class="ghost" id="csv">Download all (CSV)</button></div>';
  keys.forEach(k => {
    const list = days[k].sort((a, b) => a.token - b.token);
    const served = list.filter(o => o.done).length;
    h += '<details class="card"><summary>' + dayLabel(k) + ' <span class="mut">— ' + list.length + ' orders, ' + served + ' served</span></summary>' +
      '<div class="tot" style="margin-top:10px"><b>Total made:</b><br>' + totalsText(totalsOf(list)) + '</div>';
    list.forEach(o => {
      h += '<div class="ord"><b>#' + o.token + '</b> ' + esc(o.name) + ' <span class="mut">' + esc(o.cls) + ' · ' + timeLabel(o.t) +
           (o.done ? '' : ' · not served') + '</span><div>' + esc(itemsText(o)) + '</div></div>';
    });
    h += '<button class="ghost" data-del="' + k + '" style="margin-top:10px">Delete this day</button></details>';
  });
  app.innerHTML = h;

  document.getElementById('csv').onclick = downloadCSV;
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const k = b.dataset.del;
    if (confirm('Permanently delete all records for ' + dayLabel(k) + '?')) {
      S = load(); S.orders = S.orders.filter(o => o.day !== k); save(); render();
    }
  });
}

function downloadCSV() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Date', 'Time', 'Token', 'Name', 'Class', 'Items', 'Status'].map(q).join(',')];
  S.orders.slice().sort((a, b) => a.t - b.t).forEach(o => {
    rows.push([o.day, timeLabel(o.t), o.token, o.name, o.cls, itemsText(o), o.done ? 'Served' : 'Not served'].map(q).join(','));
  });
  if (window.Capacitor) { showCSV(rows.join('\n')); return; } // inside the Android app, file downloads are unreliable
  const blob = new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mess-orders-' + dayKey(Date.now()) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function showCSV(text) {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px';
  box.innerHTML = '<div class="card" style="width:100%;max-width:560px"><b>Records (CSV)</b>' +
    '<p class="mut">Tap Copy, then paste into WhatsApp, Notes or email to save a backup.</p>' +
    '<textarea readonly style="width:100%;height:220px;font:13px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:8px"></textarea>' +
    '<button class="ghost" id="cpy">Copy</button><button class="ghost" id="cls">Close</button></div>';
  document.body.appendChild(box);
  const ta = box.querySelector('textarea');
  ta.value = text;
  box.querySelector('#cls').onclick = () => box.remove();
  box.querySelector('#cpy').onclick = () => {
    ta.select();
    try { navigator.clipboard.writeText(text); } catch (e) { document.execCommand('copy'); }
  };
}

// Keep two tabs on the same device in sync
window.addEventListener('storage', e => {
  if (e.key === KEY) { S = load(); if (mode === 'kitchen' || mode === 'history') render(); else updateCount(); }
});

render();
</script>
</body>
</html>
